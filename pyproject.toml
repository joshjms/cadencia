[project]
name = "cadencia"
version = "1.0.0"
description = "Audio-conditioned four-key rhythm chart generation, training, and playback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa==0.11.0",
    "numpy==2.2.6",
    "pandas>=2.3.3",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
training = [
    "scikit-learn>=1.9.1",
    "torch==2.6.0",
]

placement = [
    "rosu-pp-py==4.0.2",
    "scikit-learn>=1.9.1",
    "torch==2.6.0",
    "transformers==4.53.2",
    "torchaudio==2.6.0",
    "beat-this==1.0",
]
download = [
    "yt-dlp>=2026.10.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
reportUnknownVariableType = "none"

[tool.hatch.build.targets.wheel.force-include]
"model_releases" = "model_releases"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
