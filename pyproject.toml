[project]
name = "cadencia"
version = "0.1.0"
description = "Unified rhythm chart analysis and timeline visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa==0.11.0",
    "numpy==2.2.6",
    "pandas>=2.3.3",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
training = [
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
reportUnknownVariableType = "none"
